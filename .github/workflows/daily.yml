name: Actu du jour

on:
  schedule:
    # GitHub planifie en UTC : deux horaires pour viser 05:50 à Toronto toute l'année
    # (digest prêt pour 6h). Le job "horaire" ne laisse passer que celui de la saison.
    - cron: "50 9 * * *"    # 05:50 à Toronto en heure d'été (UTC-4)
    - cron: "50 10 * * *"   # 05:50 à Toronto en heure d'hiver (UTC-5)
  workflow_dispatch:        # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  horaire:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.check.outputs.go }}
    steps:
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          CRON: ${{ github.event.schedule }}
        run: |
          if [ "$(TZ=America/Toronto date +%z)" = "-0400" ]; then attendu="50 9 * * *"; else attendu="50 10 * * *"; fi
          if [ "$EVENT" != "schedule" ] || [ "$CRON" = "$attendu" ]; then go=true; else go=false; fi
          echo "événement=$EVENT cron=$CRON attendu=$attendu go=$go"
          echo "go=$go" >> "$GITHUB_OUTPUT"

  build:
    needs: horaire
    if: needs.horaire.outputs.go == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Générer le digest
        run: python build.py
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ACTU_MODELS: ${{ vars.ACTU_MODELS }}   # variable de dépôt facultative : modèles séparés par des virgules
      - name: Enregistrer l'historique
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Digest du $(date -u +%F)"
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: Envoyer le mail
        run: python sendmail.py
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SITE_URL: ${{ vars.SITE_URL }}
